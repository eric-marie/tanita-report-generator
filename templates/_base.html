<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block html_head_title %}Rapport TANITA{% endblock %}</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
	<style>
		/* Style pour éviter le retour à la ligne dans les cellules du tableau */
        .table td, .table th {
            white-space: nowrap;
        }
	</style>
</head>
<body>
	<!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="resultats.html">Rapport TANITA</a>
        <!-- Bouton de menu pour les petits écrans -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Contenu du menu -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
			{% for page, libelle in {"resultats": "Résultats", "details": "Détails", "evolution": "Evolution"}.items() %}
                <li class="nav-item{{ ' active' if active_page == page else '' }}">
                    <a class="nav-link" href="{{ page }}.html">{{ libelle }}</a>
                </li>
			{% endfor %}
            </ul>
        </div>
    </nav>

    <!-- Contenu principal -->
    <div class="container mt-4">
        <h1 class="mb-4">{% block header %}{% endblock %}</h1>
		
        {% block content %}{% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
	
	{% block script %}{% endblock %}
</body>
</html>
